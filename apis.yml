name: Vertical Circuits
description: Vertical Circuits, Inc. (VCI) was a semiconductor company based in Scotts Valley, California,
  supplying high-density semiconductor memories and die-level vertical-interconnect packaging technology.
  Its patented ViP (vertical interconnect pillar) process stacked die to bridge wire-bond product solutions
  and through-silicon-via (TSV) technology, serving computer, telecom, consumer-electronics, aerospace, and
  military customers. The company's die-stacking IP and technology were acquired by Invensas/Tessera around
  2013. Vertical Circuits is a hardware and semiconductor-IP company with no public web API, developer portal,
  SDKs, or machine-readable API surface; it was surfaced as a Battery Ventures portfolio lead and enriched to
  record that it has no API surface to catalog.
